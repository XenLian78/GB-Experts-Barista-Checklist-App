<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G&B Experts Checklist</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body id="app-content">
    <header>
        <div class="header-content">
            <div class="logo-gb">
                <img src="assets/images/G&B-LOGO.svg" alt="G&B Experts">
            </div>
            <div class="logo-miscela">
                <img src="assets/images/MISCELA-DORO-LOGO.svg" alt="Miscela d'Oro">
            </div>
        </div>
    </header>

    <main class="form-container">
        <section class="form-section">
            <h1 class="section-title">ΣΤΟΙΧΕΙΑ ΕΠΙΣΚΕΨΗΣ</h1>
            <div class="input-group">
                <label>ΠΕΛΑΤΗΣ *</label>
                <input type="text" id="customer">
            </div>
            <div class="info-grid">
                <div class="info-item">
                    <label>ΗΜΕΡ/ΝΙΑ</label>
                    <div id="current-date" class="auto-field"></div>
                </div>
                <div class="info-item">
                    <label>ΩΡΑ ΑΦΙΞΗΣ</label>
                    <div id="arrival-time" class="auto-field"></div>
                </div>
            </div>
        </section>

        <section class="form-section">
            <h1 class="section-title">ΤΕΧΝΙΚΟΣ ΕΛΕΓΧΟΣ</h1>
            <div class="check-item">
                <span>ΚΑΘΑΡΙΣΜΟΣ ΜΗΧΑΝΗΣ</span>
                <div class="toggle-group">
                    <button type="button" class="btn-toggle" onclick="toggleBtn(this, 'yes')">ΝΑΙ</button>
                    <button type="button" class="btn-toggle" onclick="toggleBtn(this, 'no')">ΟΧΙ</button>
                </div>
            </div>
        </section>

        <section class="form-section no-print">
            <h1 class="section-title">ΥΠΟΓΡΑΦΗ ΠΕΛΑΤΗ</h1>
            <div class="signature-wrapper">
                <canvas id="signature-pad"></canvas>
            </div>
            <button type="button" class="btn-clear" onclick="clearSignature()">Καθαρισμός</button>
        </section>

        <div class="info-grid" style="margin-top: 20px;">
            <div class="info-item">
                <label>ΩΡΑ ΑΝΑΧΩΡΗΣΗΣ</label>
                <div id="departure-time" class="auto-field">--:--</div>
            </div>
        </div>

        <button type="button" id="btn-generate" class="btn-main" onclick="generatePDF()">ΟΛΟΚΛΗΡΩΣΗ & ΕΞΑΓΩΓΗ PDF</button>
    </main>

    <footer>
        <p>Copyright (c) 2026 G&B Experts. All rights reserved. Confidential and Proprietary.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
