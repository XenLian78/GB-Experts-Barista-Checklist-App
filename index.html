<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G&B Experts Checklist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-gb">
                <img src="assets/images/G&B-LOGO.svg" alt="G&B Experts">
            </div>
            <div class="logo-miscela">
                <img src="assets/images/MISCELA-DORO-LOGO.svg" alt="Miscela d'Oro">
            </div>
        </div>
    </header>

    <main class="form-container">
        <section class="form-section">
            <h1 class="section-title">ΣΤΟΙΧΕΙΑ ΕΠΙΣΚΕΨΗΣ</h1>
            <div class="input-group">
                <label>ΠΕΛΑΤΗΣ <span class="required">*</span></label>
                <input type="text" id="customer" placeholder="Όνομα επιχείρησης">
            </div>
            <div class="input-group">
                <label>Δ/ΤΙΤΛΟΣ <span class="required">*</span></label>
                <input type="text" id="title" placeholder="Διακριτικός τίτλος">
            </div>
            <div class="input-group">
                <label>ΕΠΑΦΗ ΜΕ <span class="required">*</span></label>
                <input type="text" id="contact" placeholder="Όνομα Barista">
            </div>
            <div class="info-grid">
                <div class="info-item">
                    <label>ΗΜΕΡ/ΝΙΑ</label>
                    <div id="current-date" class="auto-field"></div>
                </div>
                <div class="info-item">
                    <label>ΩΡΑ ΑΦΙΞΗΣ</label>
                    <div id="arrival-time" class="auto-field"></div>
                </div>
            </div>
        </section>

        <section class="form-section">
            <h1 class="section-title">ΤΕΧΝΙΚΟΣ ΕΛΕΓΧΟΣ</h1>
            
            <div class="measurements-grid">
                <div class="input-group">
                    <label>ΠΙΕΣΗ ΑΝΤΛΙΑΣ (bar)</label>
                    <input type="text" placeholder="π.χ. 9 bar">
                </div>
                <div class="input-group">
                    <label>ΔΟΣΗ ΜΥΛΟΥ (gr)</label>
                    <input type="text" placeholder="Γραμμάρια">
                </div>
            </div>

            <div class="check-item">
                <span>ΝΤΟΥΖΙΕΡΕΣ / ΣΙΤΕΣ</span>
                <div class="toggle-group">
                    <button type="button" class="btn-toggle" onclick="toggleBtn(this, 'yes')">ΝΑΙ</button>
                    <button type="button" class="btn-toggle" onclick="toggleBtn(this, 'no')">ΟΧΙ</button>
                </div>
            </div>

            <div class="check-item">
                <span>ΛΑΣΤΙΧΑ</span>
                <div class="toggle-group">
                    <button type="button" class="btn-toggle" onclick="toggleBtn(this, 'yes')">ΝΑΙ</button>
                    <button type="button" class="btn-toggle" onclick="toggleBtn(this, 'no')">ΟΧΙ</button>
                </div>
            </div>

            <div class="input-group">
                <label>ΕΠΕΜΒΑΣΗ</label>
                <select class="custom-select">
                    <option value="">ΕΠΙΛΕΞΕ</option>
                    <option value="clean">ΥΠΟΧΡ. ΚΑΘΑΡ.</option>
                    <option value="chem">ΚΑΘΑΡ ΜΕ ΦΑΡΜ.</option>
                    <option value="replace">ΑΝΤΙΚ/ΣΗ</option>
                </select>
            </div>
        </section>

        <div class="info-grid" style="margin-top: 30px;">
            <div class="info-item">
                <label>ΩΡΑ ΑΝΑΧΩΡΗΣΗΣ</label>
                <div id="departure-time" class="auto-field">--:--</div>
            </div>
        </div>
    </main>

    <footer>
        <p>Copyright (c) 2026 G&B Experts. All rights reserved. Confidential and Proprietary.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
